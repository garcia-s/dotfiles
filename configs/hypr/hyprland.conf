
monitor=eDP-1, preferred,auto,1
monitor=DP-1, preferred,auto,1
monitor=HDMI-A-1, prefered, auto, 1

$terminal = kitty
$fileManager = nautilus
$screenshots = grim ${slurp}

# NVIDIA STUFF
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XDG_SESSION_TYPE,wayland

env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WRL_NO_HARDWARE_CURSOR,1

# MONADO STUF

#Normal mouse stuff
env = XCURSOR_SIZE,24

#WALLPEPA
exec-once = hypridle
exec-once = hyprpaper 
exec-once = quickshell
exec-once = hyprctl setcursor default 22

input {
    kb_layout=us
    kb_variant=altgr-intl
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
    tablet {
        output = 2
        left_handed = 1
        relative_input = false
    }
    sensitivity = 0 
}

general {
    gaps_in = 5
    gaps_out = 8
    border_size = 3
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 6
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = yes
    preserve_split = yes 
}

misc {
    force_default_wallpaper = -1 
}

device {
    name=wacom-one-by-wacom-s-pen
    relative_input = true
    output=HDMI-A-1
}

windowrulev2 = float,class:xdg-desktop-portal-gtk
windowrulev2 = noshadow, on, class:.* 
windowrulev2 = opacity 1 0.97,  class:.* 
windowrulev2 = float,class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = size 800 800,class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = center 1,class:^(org.pulseaudio.pavucontrol)$

$mainMod = SUPER

#Quickshell binds
$qs = qs ipc call

bindl=,switch:on:Lid Switch, exec, hyprlock & systemctl suspend

bind = $mainMod, R,        exec, $qs panels toggle "apps"
bind = $mainMod SHIFT, X,  exec, $qs togglePowerMenu toggle
bind = $mainMod, semicolon, exec, $qs toggleCalendar toggle
bind = $mainMod SHIFT, C,  exec, $qs toggleCpuDetails toggle
bind = $mainMod SHIFT, M,  exec, $qs toggleRamDetails toggle

bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -1000
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +1000

bind = , Print, exec,  pkill -x slurp ||  grim -g "$(slurp -d)" - | wl-copy
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, K, exec, loginctl lock-session
bind = $mainMod, B, exec, $browser
bind = $mainMod, F, fullscreenstate, 1, 1
bind = $mainMod, O, fullscreenstate, 0, 3
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, P, pin, 
bind = $mainMod, V, togglefloating, 
bind = $mainMod, W, exec, pkill -x quickshell || quickshell

bind = $mainMod, h, movefocus, l 
bind = $mainMod, l, movefocus, r
bind = $mainMod, j, movefocus, u
bind = $mainMod, k, movefocus, d

bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, j, movewindow, u 
bind = $mainMod SHIFT, k, movewindow, d
bind = $mainMod, s, togglesplit 

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
